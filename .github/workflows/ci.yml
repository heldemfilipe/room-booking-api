name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # o ubuntu-24.04 traz Docker, que o Testcontainers usa para subir o PostgreSQL dos testes
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -ntp verify
