name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # o ubuntu-24.04 traz Docker, que o Testcontainers usa para subir o PostgreSQL dos testes
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -ntp verify

  # A imagem tem que construir e passar no Trivy a cada mudança (sem publicar nada: publicar é o publicar.yml, em tag)
  imagem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem
        run: docker build -t room-booking-api:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: room-booking-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
