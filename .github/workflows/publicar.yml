name: Publicar imagem

# Só roda quando alguém cria uma tag de versão (v1.0.0, v1.1.0...). Não há cron nem gatilho em push: publicar é um ato
# deliberado. Usa o GITHUB_TOKEN que o próprio GitHub entrega ao job; nenhum segredo cadastrado à mão.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publicar no GHCR
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      # 1) constrói a imagem (sem publicar) e deixa no Docker local para o Trivy
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEM }}:escaneada

      # 2) escaneia: HIGH ou CRITICAL com correção disponível derruba o job, e a imagem NÃO é publicada
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEM }}:escaneada
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 3) só então publica
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
