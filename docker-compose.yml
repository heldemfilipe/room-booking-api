# Dependências da API para o desenvolvimento local: docker compose up -d
# As senhas abaixo e as do realm (keycloak/realm-reservas.json) são SÓ para desenvolvimento local.
# Não use estes valores em nenhum outro ambiente. (Redis, Prometheus e Grafana entram nas Etapas 4 e 5.)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Keycloak em modo de desenvolvimento (banco embutido, sem HTTPS). O realm vem do JSON versionado, sem segredos de
  # cliente. A API valida os tokens pelo emissor http://localhost:8180/realms/reservas.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-reservas.json:/opt/keycloak/data/import/realm-reservas.json:ro

volumes:
  pgdata:
