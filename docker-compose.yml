# Dependências da API para o desenvolvimento local: docker compose up -d
# As senhas abaixo e as do realm (keycloak/realm-reservas.json) são SÓ para desenvolvimento local.
# Não use estes valores em nenhum outro ambiente. (Grafana: admin/admin, também só local.)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Keycloak em modo de desenvolvimento (banco embutido, sem HTTPS). O realm vem do JSON versionado, sem segredos de
  # cliente. A API valida os tokens pelo emissor http://localhost:8180/realms/reservas.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-reservas.json:/opt/keycloak/data/import/realm-reservas.json:ro

  # Redis do cache da listagem de salas (Etapa 4). Sem senha, só para desenvolvimento local.
  redis:
    image: redis:8.10.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Observabilidade (Etapa 5). A API roda na máquina; o Prometheus a alcança por host.docker.internal:8081 ---
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro

  # Traces (OTLP/HTTP na 4318, interface na 16686). Armazenamento em memória: some ao reiniciar.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4318:4318"

  # SÓ para desenvolvimento local: porta presa ao localhost, leitura anônima (papel Viewer) para abrir o dashboard sem
  # login, e admin/admin para editar. Datasources e dashboard vêm dos arquivos em observabilidade/grafana (provisionados).
  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
