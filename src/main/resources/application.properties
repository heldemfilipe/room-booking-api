spring.application.name=room-booking-api

# PostgreSQL do docker-compose.yml. Valores só para desenvolvimento local; em outro ambiente, sobrescreva por
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD. Nos testes, o Testcontainers troca tudo.
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas
spring.datasource.username=reservas
spring.datasource.password=reservas

# O Flyway é dono do schema (db/migration); o Hibernate só valida que as entidades batem com ele, nunca cria nem altera.
spring.jpa.hibernate.ddl-auto=validate
# a transação termina no service; sem isso o JPA ficaria aberto até o fim da resposta
spring.jpa.open-in-view=false

# Resource server JWT: a API só valida tokens emitidos pelo Keycloak do docker-compose.yml. O emissor (iss) do token
# precisa ser igual a este valor; o discovery (chaves públicas) é buscado na primeira requisição, não na subida.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/reservas}

# CORS explícito: só estas origens (separadas por vírgula) podem chamar a API a partir de um navegador.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Redis (docker-compose.yml): cache da listagem de salas. Se ele cair, a API segue pelo banco (CacheTolerante); os
# tempos curtos evitam que uma queda trave cada requisição esperando o Redis responder.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# Quanto tempo uma sala (ou a lista) fica no cache. É também o limite de quanto uma alteração feita direto no banco
# demora para aparecer; alterações pela API esvaziam o cache na hora (@CacheEvict).
app.cache.salas-ttl=5m

# --- Observabilidade (Etapa 5) ---
# Actuator numa porta SÓ DELE (não publicada para fora): saúde e /actuator/prometheus sem token, porque o Prometheus não
# tem token; /actuator/metrics continua só para ADMIN (veja SegurancaConfig).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics,prometheus
# liveness e readiness separados: /actuator/health/liveness (o processo está vivo?) e /actuator/health/readiness (pode
# receber tráfego?). A readiness inclui o banco; o Redis NÃO entra, porque o cache é opcional (CacheTolerante).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
# percentis calculados no Prometheus (histograma), para o p95 do dashboard e do alerta
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Traces por OpenTelemetry (OTLP/HTTP) para o Jaeger do docker-compose.yml. 100% das requisições: é uma API de estudo.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# o traceId do trace aparece nos logs (campo traceId do JSON) e como exemplar nas métricas de latência
management.tracing.exemplars.include=sampled-traces

# Logs estruturados em JSON (um objeto por linha, com traceId e spanId do MDC)
logging.structured.format.console=logstash

# Endpoint de teste com pg_sleep (experimento da Etapa 5). DESLIGADO por padrão; ligue com APP_DIAGNOSTICO=true.
app.diagnostico.habilitado=${APP_DIAGNOSTICO:false}
