spring.application.name=room-booking-api

# PostgreSQL do docker-compose.yml. Valores só para desenvolvimento local; em outro ambiente, sobrescreva por
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD. Nos testes, o Testcontainers troca tudo.
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas
spring.datasource.username=reservas
spring.datasource.password=reservas

# O Flyway é dono do schema (db/migration); o Hibernate só valida que as entidades batem com ele, nunca cria nem altera.
spring.jpa.hibernate.ddl-auto=validate
# a transação termina no service; sem isso o JPA ficaria aberto até o fim da resposta
spring.jpa.open-in-view=false

# Resource server JWT: a API só valida tokens emitidos pelo Keycloak do docker-compose.yml. O emissor (iss) do token
# precisa ser igual a este valor; o discovery (chaves públicas) é buscado na primeira requisição, não na subida.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/reservas}

# CORS explícito: só estas origens (separadas por vírgula) podem chamar a API a partir de um navegador.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
