groups:
  - name: room-booking-api
    rules:
      # Latência p95 da API acima de 1 s por 5 minutos seguidos. Sem /actuator (a sonda não é tráfego de usuário).
      - alert: ApiLatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[1m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 da API acima de 1 s por 5 minutos"
          description: "p95 atual: {{ $value | humanizeDuration }}. Veja o painel de latência e siga o traceId até o span lento (Jaeger)."

      # Mais de 5% das requisições respondendo 5xx por 5 minutos seguidos.
      - alert: ApiTaxaDeErros5xxAlta
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[1m]))
            /
          sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mais de 5% das requisições da API dando 5xx por 5 minutos"
          description: "Taxa atual de 5xx: {{ $value | humanizePercentage }}."
